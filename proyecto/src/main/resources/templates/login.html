<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        :root { --color-vino: #4a0d16; --bg-claro: #fbfbfb; }
        body { background-color: var(--bg-claro); font-family: 'Segoe UI', sans-serif; }
        .franja-vino { background-color: var(--color-vino); display: flex; align-items: center; height: 85px; padding: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .logo-container { background-color: white; height: 100%; padding: 5px 20px; display: flex; align-items: center; justify-content: center; }
        .logo-container img { max-height: 70px; }
        .header-title { color: white; font-size: 1.3rem; font-weight: bold; margin-left: 30px; margin-bottom: 0; }
        .caja-oscura { background-color: var(--color-vino); color: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); position: relative; }
        .btn-back { position: absolute; top: 15px; left: 20px; color: rgba(255, 255, 255, 0.7); font-size: 1.5rem; text-decoration: none; transition: 0.2s; line-height: 1; }
        .btn-back:hover { color: white; transform: scale(1.1); }
        .btn-blanco { background-color: white; color: var(--color-vino); border: 2px solid white; transition: all 0.3s; padding: 10px 30px; border-radius: 8px; font-weight: bold; font-size: 1.05rem; }
        .btn-blanco:hover { background-color: #f0f0f0; transform: scale(1.02); }
    </style>
</head>
<body class="d-flex flex-column h-100">

<header class="franja-vino w-100">
    <div class="logo-container">
        <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
    </div>
    <h1 class="header-title">Presidencia de Comunidad de Santa María Texcalac</h1>
</header>

<main class="container d-flex flex-column align-items-center justify-content-center flex-grow-1 my-5">
    <form th:action="@{/administrador/login}" method="post" style="max-width: 420px; width: 100%;" autocomplete="off">
        <div class="caja-oscura text-center">
            <a th:href="@{/}" class="btn-back" title="Volver al inicio">←</a>

            <h2 class="fw-bold mb-4 border-bottom pb-2">Iniciar Sesión</h2>

            <div th:if="${mensajeExito}" class="alert alert-success p-2 mb-3" style="font-size: 0.9rem;"><span th:text="${mensajeExito}"></span></div>
            <div th:if="${param.error}" class="alert alert-danger p-2 mb-3" style="font-size: 0.9rem;"><span>Correo o contraseña incorrectos.</span></div>

            <div class="text-start mb-3">
                <label class="form-label fw-bold">Correo electrónico</label>
                <input type="email" name="username" class="form-control" placeholder="admin@ejemplo.com" required autofocus pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$" autocomplete="off">
            </div>

            <div class="text-start mb-2">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required autocomplete="new-password">
            </div>

            <div class="text-end mb-4">
                <a th:href="@{/olvide-password}" class="text-warning text-decoration-none" style="font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn-blanco w-100 shadow-sm" type="submit">Entrar al Sistema</button>

            <div class="mt-4 pt-3 border-top border-secondary">
                <span class="text-white-50" style="font-size: 0.9rem;">¿No tienes cuenta?</span>
                <a th:href="@{/administrador/nuevo}" class="text-white fw-bold text-decoration-underline" style="font-size: 0.9rem;">Registrarse</a>
            </div>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
