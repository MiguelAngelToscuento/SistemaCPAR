<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cuenta - SCPAR</title>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .header { background-color: #4a0404; color: white; width: 100%; padding: 20px; text-align: center; font-weight: bold; }
        .search-container { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 50px; width: 400px; text-align: center; }
        input[type="number"] { width: 80%; padding: 12px; margin: 20px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn-buscar { background-color: #4a0404; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-buscar:hover { background-color: #630505; }
        .error-msg { color: #d9534f; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">Sistema de Control de Pagos de Agua y Registros</div>

    <div class="search-container">
        <h2>Consulta de Estado</h2>
        <p>Ingresa el folio de la tarjeta para continuar</p>
        
        <form th:action="@{/buscar}" method="POST">
            <input type="number" name="folio" placeholder="Ej. 12345" required>
            <br>
            <button type="submit" class="btn-buscar">Consultar Estado</button>
        </form>

        <div th:if="${error}" class="error-msg">
            <p th:text="${error}"></p>
        </div>
    </div>
</body>
</html>
