<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realizar Pago - Texcalac</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --color-vino: #430404;
            --bg-gris: #f8f9fa;
        }

        body {
            background-color: var(--bg-gris);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        /* ENCABEZADO */
        .header-custom {
            background-color: var(--color-vino);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 80px;
        }

        .logo-white-bg {
            background-color: white;
            padding: 5px;
            border-radius: 4px;
            margin-right: 15px;
            display: flex;
            align-items: center;
        }

        /* TARJETA DE PAGO */
        .caja-pago {
            background-color: var(--color-vino);
            color: white;
            border-radius: 20px;
            padding: 30px 40px;
            width: 100%;
            max-width: 600px; 
            position: relative; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .btn-regreso-interno {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            border: 2px solid white;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-regreso-interno:hover {
            background-color: rgba(255,255,255,0.2);
            color: white;
        }

        .caja-pago h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .form-label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-control, .form-select, .input-group-text {
            border-radius: 10px;
            border: none;
            padding: 8px 12px;
        }

        .input-group-text {
            background-color: #e9ecef;
            font-weight: bold;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        
        .input-monto {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
        }

        .btn-pagar-box {
            margin-top: 25px;
            text-align: center;
        }

        .btn-pagar {
            background-color: var(--color-vino);
            color: white;
            border: none;
            padding: 12px 100px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .btn-pagar:hover {
            transform: scale(1.03);
            background-color: #5a0606;
        }

        .rango-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<header class="header-custom">
    <div class="logo-white-bg" style="position: absolute; left: 20px;">
        <img th:src="@{/LOGO.png}" width="90" height="70">
    </div>
    <h5 class="mb-0">Presidencia de Comunidad de Santa María Texcalac</h5>
</header>

<main class="container flex-grow-1 d-flex flex-column align-items-center justify-content-center">
    
    <form th:action="@{/pagos/confirmacion}" method="post" style="width: 100%; max-width: 600px;">
        
        <div class="caja-pago mx-auto">
            <a th:href="@{/administrador/menu}" class="btn-regreso-interno" title="Volver al menú">←</a>
            
            <h2>Realizar Pago</h2>
            
            <div class="mb-3">
                <label class="form-label">Folio de tarjeta</label>
                <input type="text" name="folio" class="form-control" placeholder="Introduce el folio de la tarjeta" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre del titular (Referencia)</label>
                <input type="text" name="titular" class="form-control" placeholder="Introduce el nombre del titular" required>
            </div>

            <div class="rango-container">
                <label class="form-label d-block text-center mb-3">Periodo de pago (Rango)</label>
                
                <div class="row g-2 align-items-center mb-2">
                    <div class="col-7">
                        <select name="mesInicio" class="form-select" required>
                            <option value="" disabled selected>Mes inicio</option>
                            <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
                            <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
                            <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
                            <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
                            <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
                            <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <select name="anioInicio" class="form-select select-anio" required></select>
                    </div>
                </div>

                <div class="text-center my-1"><span class="fw-bold">a</span></div>

                <div class="row g-2 align-items-center">
                    <div class="col-7">
                        <select name="mesFin" class="form-select" required>
                            <option value="" disabled selected>Mes fin</option>
                            <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
                            <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
                            <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
                            <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
                            <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
                            <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <select name="anioFin" class="form-select select-anio" required></select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Monto</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" 
                        name="monto" 
                        id="monto"
                        class="form-control input-monto" 
                        placeholder="0.00" 
                        min="0" 
                        step="0.01" 
                        required>
                </div>
            </div>
        </div> 

        <div class="btn-pagar-box">
            <button type="submit" class="btn-pagar">Pagar</button>
        </div>
    </form>

</main>

<script>
    const llenarAnios = () => {
        const selects = document.querySelectorAll('.select-anio');
        const anioActual = new Date().getFullYear();
        const inicio = anioActual - 15;
        const fin = anioActual + 10;

        selects.forEach(select => {
            for (let i = inicio; i <= fin; i++) {
                let opcion = document.createElement('option');
                opcion.value = i;
                opcion.text = i;
                if (i === anioActual) opcion.selected = true;
                select.appendChild(opcion);
            }
        });
    }

    const montoInput = document.getElementById('monto');
    montoInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            let val = parseFloat(montoInput.value) || 0;
            montoInput.value = (val + 10).toFixed(2);
        }
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            let val = parseFloat(montoInput.value) || 0;
            if (val >= 10) montoInput.value = (val - 10).toFixed(2);
        }
    });

    window.onload = llenarAnios;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
