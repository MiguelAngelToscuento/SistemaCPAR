<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realizar Pago</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --color-vino: #4a0d16;
            --bg-claro: #f4f4f4;
        }
        body {
            background-color: var(--bg-claro);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .franja-vino { background-color: var(--color-vino); display: flex; align-items: center; height: 85px; padding: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .logo-container { background-color: white; height: 100%; padding: 5px 20px; display: flex; align-items: center; justify-content: center; }
        .logo-container img { max-height: 70px; }
        .header-title { color: white; font-size: 1.2rem; font-weight: bold; margin-left: 30px; margin-bottom: 0; }

        .caja-oscura {
            background-color: var(--color-vino);
            color: white;
            border-radius: 12px;
            padding: 35px 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            width: 100%;
            max-width: 550px;
        }
        .btn-back { position: absolute; top: 20px; left: 20px; color: rgba(255, 255, 255, 0.7); font-size: 1.2rem; text-decoration: none; transition: 0.2s; }
        .btn-back:hover { color: white; }

        .form-label { font-weight: bold; font-size: 0.9rem; margin-bottom: 0.3rem; color: white; }
        .form-control, .form-select { border-radius: 6px; border: none; padding: 0.6rem 1rem; font-size: 1rem; }
        .btn-buscar { background-color: white; color: black; border: none; font-weight: bold; padding: 0 20px; border-radius: 0 6px 6px 0; }

        .rango-container { background: rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 10px; margin-bottom: 1.5rem; }

        .info-usuario { background-color: #f8f9fa; color: #333; padding: 15px 20px; border-radius: 8px; margin-bottom: 1.5rem; }
        .info-usuario .nombre-titular { color: var(--color-vino); font-weight: bold; font-size: 1.15rem; }
        .badge-inapam { background-color: #198754; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .divisor-rojo { border-right: 1px solid rgba(220, 53, 69, 0.5); }

        .btn-registrar-pago {
            background-color: white;
            color: var(--color-vino);
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-registrar-pago:hover:not(:disabled) { background-color: #f0f0f0; transform: scale(1.02); }
        .btn-registrar-pago:disabled { opacity: 0.6; cursor: not-allowed; }

        .estado-inactivo { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body class="d-flex flex-column h-100">

<header class="franja-vino w-100">
    <div class="logo-container">
        <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
    </div>
    <h1 class="header-title">Presidencia de Comunidad de Santa María Texcalac</h1>
</header>

<main class="container flex-grow-1 d-flex flex-column align-items-center justify-content-center my-5">

    <div class="caja-oscura mx-auto">
        <a th:href="@{/administrador/menu}" class="btn-back" title="Volver al menú">←</a>
        <h2 class="fw-bold mb-4 text-center border-bottom border-secondary pb-3">Realizar Cobro</h2>

        <div th:if="${error}" class="alert alert-danger p-2 text-center shadow-sm rounded" style="font-size: 0.9rem;" th:text="${error}"></div>
        <div th:if="${mensajeExito}" class="alert alert-success p-2 text-center shadow-sm rounded" style="font-size: 0.9rem;" th:text="${mensajeExito}"></div>

        <form th:action="@{/pagos/buscar-cuenta}" method="post" class="mb-4">
            <label class="form-label">Folio de tarjeta</label>
            <div class="input-group">
                <input type="text" name="folio" class="form-control" th:value="${folioBuscado}" placeholder="Introduce el folio" pattern="[A-Za-z0-9\-]+" required>
                <button type="submit" class="btn-buscar">Buscar</button>
            </div>
        </form>

        <div th:if="${cuenta == null}">
            <div class="rango-container estado-inactivo">
                <label class="form-label d-block text-center mb-3">Periodo de pago (Rango)</label>
                <div class="row g-2 align-items-center mb-2">
                    <div class="col-7"><select class="form-select"><option>Mes inicio</option></select></div>
                    <div class="col-5"><select class="form-select"><option>2026</option></select></div>
                </div>
                <div class="text-center my-1"><span class="fw-bold text-white" style="font-size: 0.9rem;">a</span></div>
                <div class="row g-2 align-items-center">
                    <div class="col-7"><select class="form-select"><option>Mes fin</option></select></div>
                    <div class="col-5"><select class="form-select"><option>2026</option></select></div>
                </div>
            </div>

            <div class="mb-4 estado-inactivo">
                <label class="form-label d-block mb-1 fs-6">Monto</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-dark fw-bold border-0">$</span>
                    <input type="text" class="form-control bg-white text-dark fw-bold border-0" value="0.00" disabled>
                </div>
            </div>

            <button class="btn-registrar-pago" disabled>Registrar Pago</button>
        </div>

        <form id="formPago" th:action="@{/pagos/guardar-final}" method="post" th:if="${cuenta != null}">

            <input type="hidden" name="folio" th:value="${folioBuscado}">
            <input type="hidden" id="hiddenTarifa" th:value="${tarifaBase}">
            <input type="hidden" id="hiddenInapam" th:value="${cuenta.descuentoInapam != null ? cuenta.descuentoInapam : false}">

            <div class="info-usuario shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-secondary-subtle">
                    <span class="nombre-titular" th:text="${cuenta.nombres + ' ' + cuenta.apellidoPaterno + ' ' + (cuenta.apellidoMaterno != null ? cuenta.apellidoMaterno : '')}">---</span>
                    <span class="badge-inapam" th:if="${cuenta.descuentoInapam}">INAPAM (-$20)</span>
                </div>
                <div class="row text-center mt-2" style="font-size: 0.9rem;">
                    <div class="col divisor-rojo">
                        <span class="text-muted">Servicio:</span> <strong class="text-dark" th:text="${tipoServicio}">---</strong>
                    </div>
                    <div class="col">
                        <span class="text-muted">Tarifa:</span> <strong class="text-dark" th:text="${'$' + tarifaBase}">$0.00</strong>
                    </div>
                </div>
            </div>

            <div class="rango-container">
                <label class="form-label d-block text-center mb-3">Periodo de pago (Rango)</label>
                <div class="row g-2 align-items-center mb-2">
                    <div class="col-7">
                        <select name="mesInicio" id="mesInicio" class="form-select calcular-trigger" required>
                            <option value="1" th:selected="${mesActual == 1}">Enero</option>
                            <option value="2" th:selected="${mesActual == 2}">Febrero</option>
                            <option value="3" th:selected="${mesActual == 3}">Marzo</option>
                            <option value="4" th:selected="${mesActual == 4}">Abril</option>
                            <option value="5" th:selected="${mesActual == 5}">Mayo</option>
                            <option value="6" th:selected="${mesActual == 6}">Junio</option>
                            <option value="7" th:selected="${mesActual == 7}">Julio</option>
                            <option value="8" th:selected="${mesActual == 8}">Agosto</option>
                            <option value="9" th:selected="${mesActual == 9}">Septiembre</option>
                            <option value="10" th:selected="${mesActual == 10}">Octubre</option>
                            <option value="11" th:selected="${mesActual == 11}">Noviembre</option>
                            <option value="12" th:selected="${mesActual == 12}">Diciembre</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <select name="anioInicio" id="anioInicio" class="form-select calcular-trigger" required>
                            <option th:each="anio : ${listaAnios}" th:value="${anio}" th:text="${anio}" th:selected="${anio == anioActual}"></option>
                        </select>
                    </div>
                </div>

                <div class="text-center my-1"><span class="fw-bold text-white" style="font-size: 0.9rem;">a</span></div>

                <div class="row g-2 align-items-center">
                    <div class="col-7">
                        <select name="mesFin" id="mesFin" class="form-select calcular-trigger" required>
                            <option value="1" th:selected="${mesActual == 1}">Enero</option>
                            <option value="2" th:selected="${mesActual == 2}">Febrero</option>
                            <option value="3" th:selected="${mesActual == 3}">Marzo</option>
                            <option value="4" th:selected="${mesActual == 4}">Abril</option>
                            <option value="5" th:selected="${mesActual == 5}">Mayo</option>
                            <option value="6" th:selected="${mesActual == 6}">Junio</option>
                            <option value="7" th:selected="${mesActual == 7}">Julio</option>
                            <option value="8" th:selected="${mesActual == 8}">Agosto</option>
                            <option value="9" th:selected="${mesActual == 9}">Septiembre</option>
                            <option value="10" th:selected="${mesActual == 10}">Octubre</option>
                            <option value="11" th:selected="${mesActual == 11}">Noviembre</option>
                            <option value="12" th:selected="${mesActual == 12}">Diciembre</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <select name="anioFin" id="anioFin" class="form-select calcular-trigger" required>
                            <option th:each="anio : ${listaAnios}" th:value="${anio}" th:text="${anio}" th:selected="${anio == anioActual}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-4 mt-3">
                <label class="form-label d-block mb-1 fs-6">Monto</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-dark fw-bold border-0">$</span>
                    <input type="text" id="inputTotalVisual" class="form-control bg-white text-dark fw-bold border-0" value="0.00" readonly>
                </div>
            </div>

            <button type="button" class="btn-registrar-pago" data-bs-toggle="modal" data-bs-target="#modalConfirmacion" onclick="prepararConfirmacion()">Registrar Pago</button>
        </form>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:if="${cuenta != null}">
    function calcularEnVivo() {
        const mInicio = parseInt(document.getElementById('mesInicio').value);
        const aInicio = parseInt(document.getElementById('anioInicio').value);
        const mFin = parseInt(document.getElementById('mesFin').value);
        const aFin = parseInt(document.getElementById('anioFin').value);

        const tarifa = parseFloat(document.getElementById('hiddenTarifa').value);
        const tieneInapam = document.getElementById('hiddenInapam').value === 'true';

        let meses = ((aFin - aInicio) * 12) + (mFin - mInicio) + 1;
        const btn = document.querySelector('[data-bs-target="#modalConfirmacion"]');
        const inputVisual = document.getElementById('inputTotalVisual');

        if (meses <= 0) {
            inputVisual.value = "Rango Inválido";
            btn.disabled = true;
            return;
        }

        btn.disabled = false;
        let total = tarifa * meses;

        if (tieneInapam) {
            total -= (20 * meses);
        }

        inputVisual.value = total.toFixed(2);
    }

    function prepararConfirmacion() {
        const selMesInicio = document.getElementById('mesInicio');
        const selAnioInicio = document.getElementById('anioInicio');
        const selMesFin = document.getElementById('mesFin');
        const selAnioFin = document.getElementById('anioFin');

        const mesInicioTexto = selMesInicio.options[selMesInicio.selectedIndex].text;
        const anioInicioTexto = selAnioInicio.value;
        const mesFinTexto = selMesFin.options[selMesFin.selectedIndex].text;
        const anioFinTexto = selAnioFin.value;

        document.getElementById('textoPeriodo').innerText =
            mesInicioTexto + " " + anioInicioTexto + " al " + mesFinTexto + " " + anioFinTexto;
    }

    document.querySelectorAll('.calcular-trigger').forEach(select => {
        select.addEventListener('change', calcularEnVivo);
    });

    window.onload = calcularEnVivo;
</script>

<div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title" id="modalLabel">Confirmar Pago</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que la información es correcta?</p>
                <hr>
                <p><strong>Periodo a pagar:</strong> <span id="textoPeriodo"></span></p>
                <small class="text-muted">Si no es correcto, cancela y modifica los datos.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" onclick="document.getElementById('formPago').submit();">Sí, confirmar pago</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
