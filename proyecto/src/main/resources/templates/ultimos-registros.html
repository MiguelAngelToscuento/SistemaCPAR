<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Últimos Registros por Calle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        :root { --color-vino: #4a0d16; --bg-claro: #fbfbfb; }
        body { background-color: var(--bg-claro); font-family: 'Segoe UI', sans-serif; }
        .franja-vino { background-color: var(--color-vino); display: flex; align-items: center; height: 70px; padding: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .logo-container { background-color: white; height: 100%; padding: 5px 20px; display: flex; align-items: center; justify-content: center; }
        .logo-container img { max-height: 55px; }
        .header-title { color: white; font-size: 1.2rem; font-weight: bold; margin-left: 30px; margin-bottom: 0; }

        .caja-ancha { background-color: var(--color-vino); color: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); position: relative; width: 100%; max-width: 1000px; }
        .btn-back { position: absolute; top: 15px; left: 20px; color: rgba(255, 255, 255, 0.7); font-size: 1.5rem; text-decoration: none; transition: 0.2s; line-height: 1; }
        .btn-back:hover { color: white; transform: scale(1.1); }

        .form-select { border-radius: 8px; border: none; padding: 0.6rem 1rem; font-size: 1rem; }
        .table-container { background-color: white; color: #333; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .table { margin-bottom: 0; }
        .table th { color: var(--color-vino); font-weight: bold; }
        .btn-consultar { background-color: var(--color-vino); color: white; border: none; padding: 4px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; transition: 0.2s; }
        .btn-consultar:hover { background-color: #63121d; color: white; }
    </style>
</head>
<body class="d-flex flex-column h-100">

<header class="franja-vino w-100">
    <div class="logo-container">
        <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
    </div>
    <h1 class="header-title">Presidencia de Comunidad de Santa María Texcalac</h1>
</header>

<main class="container d-flex flex-column align-items-center justify-content-center flex-grow-1 my-4">
    <div class="caja-ancha">
        <a th:href="@{/administrador/menu}" class="btn-back" title="Volver al menú">←</a>

        <h2 class="fw-bold mb-4 border-bottom pb-2 text-center fs-4">Consulta de Registros por Calle</h2>

        <form th:action="@{/usuarios/ultimos-registros}" method="get" id="formFiltroCalle" class="mx-auto" style="max-width: 500px;">
            <label class="form-label d-block text-center fw-bold mb-2">Selecciona una Calle para ver sus usuarios</label>
            <select name="idCalle" class="form-select text-center fw-bold" onchange="document.getElementById('formFiltroCalle').submit();">
                <option value="">-- Seleccionar Calle --</option>
                <option th:each="calle : ${listaCalles}"
                        th:value="${calle.idCalle}"
                        th:text="${calle.nombreCalle}"
                        th:selected="${calle.idCalle == idCalleSeleccionada}"></option>
            </select>
        </form>

        <div th:if="${idCalleSeleccionada != null}">

            <div th:if="${listaCuentas != null and not #lists.isEmpty(listaCuentas)}" class="table-container shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Folio</th>
                            <th>Nombre Completo</th>
                            <th>Dirección</th>
                            <th class="text-center">INAPAM</th>
                            <th class="text-center">Acción</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cuenta : ${listaCuentas}">
                            <td class="fw-bold" th:text="${cuenta.folioTarjeta}"></td>

                            <td>
                                <span th:text="${cuenta.nombres}"></span>
                                <span th:text="${cuenta.apellidoPaterno}"></span>
                                <span th:if="${cuenta.apellidoMaterno != null}" th:text="${cuenta.apellidoMaterno}"></span>
                            </td>

                            <td>
                                <span th:text="'#' + ${cuenta.numeroExterior}"></span>
                                <span th:if="${cuenta.numeroInterior != null and cuenta.numeroInterior != ''}" th:text="' Int. ' + ${cuenta.numeroInterior}"></span>
                            </td>

                            <td class="text-center">
                                <span th:if="${cuenta.descuentoInapam == true}" class="badge bg-success">Sí</span>
                                <span th:unless="${cuenta.descuentoInapam == true}" class="badge bg-secondary">No</span>
                            </td>

                            <td class="text-center">
                                <a th:href="@{/estado-cuenta/{folio}(folio=${cuenta.folioTarjeta})}" class="btn-consultar">Ver Estado</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${listaCuentas == null or #lists.isEmpty(listaCuentas)}" class="text-center mt-4 p-4 rounded" style="background-color: rgba(255,255,255,0.05);">
                <p class="fs-5 mb-0 text-warning">No se encontraron usuarios registrados en esta calle todavía.</p>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
