<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Información de Pago - Texcalac</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --color-vino: #430404;
            --bg-gris: #f8f9fa;
        }

        body {
            background-color: var(--bg-gris);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* ENCABEZADO IDÉNTICO AL MENÚ */
        .franja-vino {
            background-color: var(--color-vino);
            display: flex;
            align-items: center;
            height: 85px;
            padding: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            background-color: white;
            height: 100%;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-height: 70px;
        }

        .header-title {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            margin-left: 30px;
            margin-bottom: 0;
        }

        /* CAJA DE INFORMACIÓN (ESTILO IMAGEN) */
        .caja-informacion {
            background-color: var(--color-vino);
            color: white;
            border-radius: 15px;
            padding: 45px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .caja-informacion h2 {
            text-align: center;
            font-weight: normal;
            font-size: 2.2rem;
            margin-bottom: 35px;
        }

        .caja-informacion p {
            font-size: 1.25rem;
            margin-bottom: 18px;
            font-weight: 300;
        }

        /* BOTONES */
        .btn-regresar {
            background-color: var(--color-vino);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 10px;
            font-size: 1.3rem;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-regresar:hover {
            background-color: #2e0202;
            color: white;
        }

        .btn-generar {
            background-color: white;
            color: black;
            border: 2px solid var(--color-vino);
            padding: 12px 35px;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-generar:hover {
            background-color: var(--color-vino);
            color: white;
        }
    </style>
</head>
<body>

<header class="franja-vino w-100">
    <div class="logo-container">
        <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
    </div>
    <h1 class="header-title">Presidencia de Comunidad de Santa María Texcalac</h1>
</header>

<main class="container flex-grow-1 d-flex flex-column align-items-center justify-content-center">

    <div class="caja-informacion">
        <h2>Informacion de Pago</h2>
        
        <p>Folio de Tarjeta: <span th:text="${cuenta.folioTarjeta}"></span></p>
        <p>Nombre del Titular: <span th:text="${cuenta.nombres + ' ' + cuenta.apellidoPaterno + ' ' + cuenta.apellidoMaterno}"></span></p>
        <p>Periodo: <span th:text="${pago.periodo}"></span></p>
        <p>Monto Total: $<span th:text="${pago.montoTotal}"></span></p>
        <p>Descuento INAPAM: <span th:text="${cuenta.descuentoInapam ? 'Si' : 'No'}"></span></p>
    </div>

    <form th:action="@{/pagos/guardar}" method="post">
        <input type="hidden" name="folio" th:value="${cuenta.folioTarjeta}">
        <input type="hidden" name="monto" th:value="${pago.montoTotal}">
        <input type="hidden" name="periodo" th:value="${pago.periodo}">

        <div class="d-flex justify-content-center gap-4 mb-5">
            <a th:href="@{/administrador/menu}" class="btn-regresar">Regresar al Inicio</a>
            <button type="submit" class="btn-generar">Generar Recibo</button>
        </div>
    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
