<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Usuario - Texcalac</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <style>
    :root { --color-vino: #4a0d16; --bg-claro: #fbfbfb; }
    body { background-color: var(--bg-claro); font-family: 'Segoe UI', sans-serif; }
    .franja-vino { background-color: var(--color-vino); display: flex; align-items: center; height: 70px; padding: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    .logo-container { background-color: white; height: 100%; padding: 5px 20px; display: flex; align-items: center; justify-content: center; }
    .logo-container img { max-height: 55px; }
    .header-title { color: white; font-size: 1.2rem; font-weight: bold; margin-left: 30px; margin-bottom: 0; }

    .caja-oscura { background-color: var(--color-vino); color: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); position: relative; }
    .btn-back { position: absolute; top: 15px; left: 20px; color: rgba(255, 255, 255, 0.7); font-size: 1.5rem; text-decoration: none; transition: 0.2s; line-height: 1; }
    .btn-back:hover { color: white; transform: scale(1.1); }
    .btn-blanco { background-color: white; color: var(--color-vino); border: 2px solid white; transition: all 0.3s; padding: 10px 30px; border-radius: 8px; font-weight: bold; font-size: 1.05rem; }
    .btn-blanco:hover { background-color: #f0f0f0; transform: scale(1.02); }

    .form-label { font-weight: bold; font-size: 0.9rem; margin-bottom: 0.2rem; color: rgba(255, 255, 255, 0.9); }
    .form-control, .form-select { border-radius: 8px; border: none; padding: 0.4rem 0.8rem; font-size: 0.95rem; }

    .form-switch .form-check-input { cursor: pointer; }
    .label-switch { font-size: 1.05rem; transition: 0.3s; cursor: pointer; }
    .switch-activo { font-weight: bold; color: #ffc107 !important; }
  </style>
</head>
<body class="d-flex flex-column h-100">

<header class="franja-vino w-100">
  <div class="logo-container">
    <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
  </div>
  <h1 class="header-title">Presidencia de Comunidad de Santa María Texcalac</h1>
</header>

<main class="container d-flex flex-column align-items-center justify-content-center flex-grow-1 my-3">
  <form th:action="${esEdicion != null && esEdicion} ? @{/usuarios/actualizar} : @{/usuarios/guardar}"
        method="post" th:object="${registroDTO}" style="max-width: 850px; width: 100%;">

    <div class="caja-oscura">
      <a th:href="@{/administrador/menu}" class="btn-back" title="Volver al menú">←</a>

      <h2 class="fw-bold mb-4 border-bottom pb-2 text-center fs-4"
          th:text="${esEdicion != null && esEdicion} ? 'Editar Cliente' : 'Registro de Nuevo Usuario'">
      </h2>

      <div th:if="${mensajeError}" class="alert alert-danger p-2 mb-3 text-center shadow-sm" role="alert" style="font-size: 0.9rem;">
        <strong class="d-block">¡Atención!</strong>
        <span th:text="${mensajeError}">Error</span>
      </div>

      <div class="d-flex justify-content-center align-items-center mb-4" th:if="${esEdicion == null || !esEdicion}">
        <span class="text-white me-3 label-switch" id="label-libro" onclick="document.getElementById('switchTipoUsuario').click()">Usuarios en libro</span>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch" id="switchTipoUsuario" checked style="transform: scale(1.6);">
        </div>
        <span class="text-white ms-4 label-switch switch-activo" id="label-nuevo" onclick="document.getElementById('switchTipoUsuario').click()">Usuario Nuevo</span>
      </div>

      <div class="row g-2 mb-3 p-3 rounded text-center mx-auto" style="background-color: rgba(255,255,255,0.1); max-width: 500px;">
        <label for="folioTarjeta" class="form-label fs-6 text-warning mb-0">Folio de la Tarjeta</label>
        <input type="text" th:field="*{folioTarjeta}" class="form-control text-center fw-bold fs-4 mt-1"
               id="folioTarjeta" placeholder="Ej. pin-0065"
               th:readonly="${esEdicion != null && esEdicion}"
               pattern="[A-Za-z0-9\-]+"
               title="El folio debe contener letras, un guion y números"
               required autofocus>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-4">
          <label for="nombres" class="form-label">Nombres</label>
          <input type="text" th:field="*{nombres}" class="form-control" id="nombres" placeholder="Ej. Juan Carlos" required>
        </div>
        <div class="col-md-4">
          <label for="apellidoPaterno" class="form-label">Apellido Paterno</label>
          <input type="text" th:field="*{apellidoPaterno}" class="form-control" id="apellidoPaterno" placeholder="Ej. Pérez" required>
        </div>
        <div class="col-md-4">
          <label for="apellidoMaterno" class="form-label">Apellido Materno</label>
          <input type="text" th:field="*{apellidoMaterno}" class="form-control" id="apellidoMaterno" placeholder="Ej. López" required>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label for="idCalle" class="form-label">Calle</label>
          <select th:field="*{idCalle}" class="form-select" id="idCalle" required>
            <option value="">Seleccione una calle...</option>
            <option th:each="calle : ${listaCalles}" th:value="${calle.idCalle}" th:text="${calle.nombreCalle}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="numeroExterior" class="form-label">N° Exterior</label>
          <input type="text" th:field="*{numeroExterior}" class="form-control" id="numeroExterior" placeholder="Ej. 12" required>
        </div>
        <div class="col-md-3">
          <label for="numeroInterior" class="form-label">N° Interior</label>
          <input type="text" th:field="*{numeroInterior}" class="form-control" id="numeroInterior" placeholder="Ej. B (Opcional)">
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-4">
          <label for="codigoPostal" class="form-label">Código Postal</label>
          <input type="text" th:field="*{codigoPostal}" class="form-control" id="codigoPostal" placeholder="Ej. 90402" required>
        </div>
        <div class="col-md-4">
          <label for="idServicio" class="form-label">Tipo de Servicio</label>
          <select th:field="*{idServicio}" class="form-select" id="idServicio" required>
            <option value="">Servicio...</option>
            <option th:each="servicio : ${listaServicios}" th:value="${servicio.idServicio}" th:text="${servicio.nombreServicio}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="fechaRegistro" class="form-label">Fecha de Registro</label>
          <input type="date" th:field="*{fechaRegistro}" class="form-control" id="fechaRegistro" required>
        </div>
      </div>

      <div class="row g-2 mb-3" id="contenedorUltimoPago" th:style="${esEdicion != null && esEdicion} ? 'display: block;' : 'display: none;'">
        <div class="col-12 p-3 rounded text-center border" style="background-color: rgba(255, 193, 7, 0.15); border-color: rgba(255, 193, 7, 0.5) !important;">
          <label for="fechaUltimoPago" class="form-label text-warning fs-6">Último mes pagado en libro físico</label>
          <input type="date" th:field="*{fechaUltimoPago}" class="form-control text-center mx-auto" id="fechaUltimoPago" style="max-width: 300px;">
          <small class="d-block text-white-50 mt-1">Esta fecha se registrará en el sistema como su último pago acreditado.</small>
        </div>
      </div>

      <div class="row g-2 mt-1 mb-3">
        <div class="col-12 bg-white rounded p-2 d-flex align-items-center justify-content-center shadow-sm">
          <div class="form-check mb-0 d-flex align-items-center">
            <input class="form-check-input border-secondary me-2" type="checkbox" th:field="*{descuentoInapam}" id="descuentoInapam" style="transform: scale(1.2);">
            <label class="form-check-label text-dark fw-bold" for="descuentoInapam" style="font-size: 0.95rem;">
              Aplicar Descuento (INAPAM, Jubilado, Pensionado)
            </label>
          </div>
        </div>
      </div>

      <div class="text-center mt-3">
        <button class="btn-blanco shadow-sm w-100" style="max-width: 400px;" type="submit"
                th:text="${esEdicion != null && esEdicion} ? 'Guardar Cambios' : 'Registrar Usuario'">
        </button>
      </div>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const switchTipo = document.getElementById("switchTipoUsuario");
    const contenedorPago = document.getElementById("contenedorUltimoPago");
    const inputUltimoPago = document.getElementById("fechaUltimoPago");
    const labelNuevo = document.getElementById("label-nuevo");
    const labelLibro = document.getElementById("label-libro");

    // Si el switch no existe (porque es la pantalla de edición), no ejecuta la lógica del switch
    if (!switchTipo) return;

    function alternarFormulario() {
      if (switchTipo.checked) {
        contenedorPago.style.display = "none";
        inputUltimoPago.required = false;
        inputUltimoPago.value = "";

        labelNuevo.classList.add("switch-activo");
        labelLibro.classList.remove("switch-activo");
      } else {
        contenedorPago.style.display = "block";
        inputUltimoPago.required = true;

        labelLibro.classList.add("switch-activo");
        labelNuevo.classList.remove("switch-activo");
      }
    }

    switchTipo.addEventListener("change", alternarFormulario);
    alternarFormulario();
  });
</script>
</body>
</html>
