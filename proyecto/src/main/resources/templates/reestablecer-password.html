<!DOCTYPE html>
<html lang="es" class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Nueva Contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        :root { --color-vino: #4a0d16; --bg-claro: #fbfbfb; }
        body { background-color: var(--bg-claro); font-family: 'Segoe UI', sans-serif; }
        .franja-vino { background-color: var(--color-vino); display: flex; align-items: center; height: 85px; padding: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .logo-container { background-color: white; height: 100%; padding: 5px 20px; display: flex; align-items: center; justify-content: center; }
        .logo-container img { max-height: 70px; }
        .header-title { color: white; font-size: 1.3rem; font-weight: bold; margin-left: 30px; margin-bottom: 0; }

        /* Esta es la clase que le da el fondo vino, bordes curvos y sombra */
        .caja-oscura { background-color: var(--color-vino); color: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); position: relative; }

        .btn-blanco { background-color: white; color: var(--color-vino); border: 2px solid white; transition: all 0.3s; padding: 10px 30px; border-radius: 8px; font-weight: bold; font-size: 1.05rem; }
        .btn-blanco:hover { background-color: #f0f0f0; transform: scale(1.02); }
    </style>
</head>
<body class="d-flex flex-column h-100">

<header class="franja-vino w-100">
    <div class="logo-container">
        <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
    </div>
    <h1 class="header-title">Presidencia de Comunidad de Santa María Texcalac</h1>
</header>

<main class="container d-flex flex-column align-items-center justify-content-center flex-grow-1 my-5">
    <form th:action="@{/reestablecer-password}" method="post" style="max-width: 450px; width: 100%;" autocomplete="off" id="form-reset">

        <input type="hidden" name="token" th:value="${token}">

        <div class="caja-oscura text-center">

            <h2 class="fw-bold mb-3 border-bottom pb-2">Nueva Contraseña</h2>

            <p class="text-white-50 mb-4" style="font-size: 0.95rem;">Crea una nueva contraseña para tu cuenta administrativa.</p>

            <div th:if="${error}" class="alert alert-danger p-2 mb-3" style="font-size: 0.9rem;" th:text="${error}"></div>

            <div class="text-start mb-3">
                <label class="form-label fw-bold text-white">Nueva contraseña</label>
                <input type="password" name="password" id="password" class="form-control mb-2" placeholder="Crea una contraseña segura" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}" autocomplete="new-password" autofocus>

                <ul class="text-white-50 m-0" style="font-size: 0.85rem; padding-left: 1.2rem; text-align: left;">
                    <li>Mínimo 8 caracteres</li>
                    <li>Mayúsculas, minúsculas y números</li>
                    <li>Un símbolo especial (!@#$)</li>
                </ul>
            </div>

            <div class="text-start mb-4">
                <label class="form-label fw-bold text-white">Confirmar nueva contraseña</label>
                <input type="password" name="confirmarPassword" id="confirmarPassword" class="form-control" placeholder="Vuelve a escribir la contraseña" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}" autocomplete="new-password">
                <div id="passwordError" class="text-warning mt-1" style="display: none; font-size: 0.85rem;">Las contraseñas no coinciden.</div>
            </div>

            <button class="btn-blanco w-100 shadow-sm" type="submit">Guardar y Entrar</button>
        </div>
    </form>
</main>

<script>
    document.getElementById('form-reset').addEventListener('submit', function(event) {
        let pass1 = document.getElementById('password').value;
        let pass2 = document.getElementById('confirmarPassword').value;
        let msjError = document.getElementById('passwordError');

        if (pass1 !== pass2) {
            event.preventDefault();
            msjError.style.display = 'block';
        } else {
            msjError.style.display = 'none';
        }
    });
</script>
</body>
</html>
