<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio - Texcalac</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        :root { --color-vino: #4a0d16; --bg-claro: #fbfbfb; }
        body { background-color: var(--bg-claro); font-family: 'Segoe UI', sans-serif; }
        .franja-vino { background-color: var(--color-vino); display: flex; align-items: center; height: 85px; padding: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .logo-container { background-color: white; height: 100%; padding: 5px 20px; display: flex; align-items: center; justify-content: center; }
        .logo-container img { max-height: 70px; }
        .header-title { color: white; font-size: 1.3rem; font-weight: bold; margin-left: 30px; margin-bottom: 0; }
        .btn-vino { background-color: var(--color-vino); border: 2px solid var(--color-vino); color: white; transition: all 0.3s; padding: 10px 40px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; }
        .btn-vino:hover { background-color: white; color: var(--color-vino); }
    </style>
</head>
<body class="d-flex flex-column h-100 text-center">

<header class="franja-vino w-100">
    <div class="logo-container">
        <img th:src="@{/LOGO.png}" alt="Logo Texcalac">
    </div>
    <h1 class="header-title d-none d-md-block">Presidencia de Comunidad de Santa María Texcalac</h1>
    <h1 class="header-title d-md-none">S.C.P.A.R.</h1>
</header>

<div class="d-flex w-100 h-100 p-3 mx-auto flex-column align-items-center justify-content-center">
    <div class="logoPresidencia mb-4">
        <img th:src="@{/LOGO.png}" width="250" height="250" alt="Logo">
    </div>
    <main class="px-3">
        <h3 class="fw-bold text-dark mb-4">Sistema de Control de Pagos de Agua y Registros</h3>
        <a href="administrador/login" class="btn btn-vino shadow-sm">Iniciar sesión al sistema</a>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
